version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.108.2
    container_name: n8n
    restart: always
    networks:
      - web
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=aaa111!!!
      - N8N_HOST=n8n.hmti.com.br
      - N8N_PORT=5678
      - WEBHOOK_TUNNEL_URL=https://n8n.hmti.com.br
    volumes:
      - n8n_data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.hmti.com.br`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=lets-encrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=web"

volumes:
  n8n_data:


networks:
  web:
    external: true
