receivers:
  # Coleta métricas de todos os containers Docker
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 10s
    timeout: 5s
    api_version: 1.24
    metrics:
      container.memory.usage.limit:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.memory.percent:
        enabled: true
      container.cpu.usage.total:
        enabled: true
      container.cpu.percent:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true

  # Recebe métricas/traces das aplicações via OTLP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Métricas do próprio host
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:
      paging:

processors:
  # Adiciona atributos de recursos
  resource:
    attributes:
      - key: service.name
        value: "docker-host"
        action: upsert

  # Batch para melhor performance
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Filtra métricas desnecessárias (opcional)
  filter:
    metrics:
      exclude:
        match_type: strict
        metric_names:
          - container.uptime

exporters:
  # Debug - Por enquanto apenas logging até configurar ClickHouse corretamente
  logging:
    verbosity: detailed

service:
  pipelines:
    # Pipeline de métricas
    metrics:
      receivers: [docker_stats, hostmetrics, otlp]
      processors: [batch, resource]
      exporters: [logging]

    # Pipeline de traces
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]

    # Pipeline de logs
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
